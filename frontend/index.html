<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataAgent - AI 数据问询助手</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1117;--surface:#161822;--surface2:#1a1d27;--border:#2a2d3a;--accent:#4f8ff7;--accent2:#a78bfa;--text:#e4e6eb;--text2:#8b8fa3;--green:#34d399;--red:#f87171;--yellow:#fbbf24;--input-bg:#0f1117;--hover:#1f2230;--modal-bg:#1a1d27;--tag-bg:#151f28;--conn-bar:#1a1520;--sel-bg:#151f28;--cf-bg:#1a1520;--err-bg:#2d1b1b;--test-ok:#151f1a}
body.warm{--bg:#faf6f1;--surface:#f5efe6;--surface2:#efe8dd;--border:#d9cebf;--accent:#c07830;--accent2:#b85c1e;--text:#3d3226;--text2:#8c7b6a;--green:#2d8a56;--red:#c0392b;--yellow:#c07830;--input-bg:#fffdf9;--hover:#e8dfd2;--modal-bg:#f5efe6;--tag-bg:#efe8dd;--conn-bar:#f0eae0;--sel-bg:#efe8dd;--cf-bg:#f0e6da;--err-bg:#fce8e6;--test-ok:#e6f4ea}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s}
.header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;transition:background .3s}
.header h1{font-size:16px;font-weight:600}
.badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500}
.badge.ai{background:var(--accent);color:#fff}.badge.gov{background:var(--accent2);color:#fff}
.theme-btn{font-size:10px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:4px;cursor:pointer;transition:all .15s}
.theme-btn:hover{color:var(--text);border-color:var(--accent)}
.conn-bar{display:flex;align-items:center;gap:10px;padding:6px 16px;background:var(--conn-bar);border-bottom:1px solid var(--border);flex-shrink:0;font-size:11px;transition:background .3s}
.conn-bar .lbl{color:var(--text2)}.conn-bar .tags{display:flex;gap:6px;flex-wrap:wrap}
.conn-bar .tag{background:var(--tag-bg);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:10px;color:var(--green)}
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:280px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;transition:background .3s}
.sec{padding:12px 16px;border-bottom:1px solid var(--border)}
.sec h3{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.sec h3 button{font-size:9px;background:none;border:1px solid var(--border);color:var(--text2);padding:2px 6px;border-radius:4px;cursor:pointer}
.sec h3 button:hover{color:var(--text);border-color:var(--accent)}
.citem{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:11px;margin-bottom:3px;border:1px solid transparent;transition:all .15s;cursor:pointer}
.citem:hover{background:var(--hover);border-color:var(--border)}.citem.on{border-color:var(--accent);background:var(--sel-bg)}
.ctoggle{width:28px;height:16px;border-radius:8px;background:var(--border);position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.ctoggle.on{background:var(--green)}.ctoggle::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .2s}
.ctoggle.on::after{left:14px}
.cname{color:var(--text);font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cinfo{color:var(--text2);font-size:9px}.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cdot.mysql{background:#f29111}.cdot.postgresql{background:#336791}.cdot.sqlite{background:var(--green)}.cdot.clickhouse{background:var(--yellow)}
.cdel{color:var(--red);font-size:14px;cursor:pointer;opacity:0;transition:opacity .15s}.citem:hover .cdel{opacity:1}
.stree{font-size:10px;line-height:1.5}
.stree .dbh{color:var(--accent2);font-weight:600;font-size:11px;margin-top:6px;margin-bottom:2px;cursor:pointer;display:flex;align-items:center;gap:4px}
.stree .dbh .arw{font-size:9px;transition:transform .2s;display:inline-block}
.stree .dbh.folded .arw{transform:rotate(-90deg)}.stree .dbbody{overflow:hidden}.stree .dbbody.folded{display:none}
.stree .dbnote{font-size:9px;color:var(--text2);font-style:italic;padding:2px 0 4px 12px}
.stree .tname{color:var(--accent);font-weight:600;cursor:pointer;padding-left:6px}.stree .tname:hover{opacity:.8}
.stree .cols{display:none;padding-left:14px;color:var(--text2);font-size:9px}.stree .tname.open+.cols{display:block}
.exlist{display:flex;flex-direction:column;gap:3px}
.exlist button{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:4px;font-size:10px;text-align:left;cursor:pointer;transition:all .15s}
.exlist button:hover{background:var(--hover);border-color:var(--accent)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2);gap:10px;text-align:center}
.empty .icon{font-size:36px;opacity:.4}.empty p{font-size:12px;max-width:360px}
.msg{max-width:88%;animation:fadeIn .3s ease}
.msg.user{align-self:flex-end;background:var(--accent);padding:8px 12px;border-radius:14px 14px 4px 14px;font-size:13px;line-height:1.5;color:#fff}
.msg.agent{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;width:100%}
.selcard{background:var(--sel-bg);border:1px solid var(--accent);border-radius:8px;padding:12px;margin:0}
.selcard h4{color:var(--accent);font-size:12px;margin-bottom:8px}
.selopts{display:flex;flex-direction:column;gap:5px}
.selopt{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px;cursor:pointer;transition:all .15s;color:var(--text)}
.selopt:hover{border-color:var(--accent);background:var(--hover)}
.selopt strong{display:block;font-size:11px}.selopt .info{font-size:9px;color:var(--text2);margin-top:2px}
.selopt.picked{border-color:var(--green);background:var(--test-ok)}
.selbtn{background:var(--accent);border:none;border-radius:6px;padding:6px;color:#fff;font-size:11px;font-weight:500;cursor:pointer;margin-top:8px;width:100%}
.selbtn:hover{opacity:.85}.selbtn:disabled{background:var(--border);cursor:not-allowed}
.cfcard{background:var(--cf-bg);border:1px solid var(--accent2);border-radius:8px;padding:12px}
.cfcard h4{color:var(--accent2);font-size:12px;margin-bottom:8px}
.cfopts{display:flex;flex-direction:column;gap:5px}
.cfopt{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px;cursor:pointer;transition:all .15s;color:var(--text)}
.cfopt:hover{border-color:var(--accent2);background:var(--hover)}
.cfopt strong{display:block;font-size:11px;margin-bottom:2px}.cfopt .dept{font-size:9px;color:var(--text2)}
.cfopt .desc{font-size:10px;color:var(--text);margin-top:2px}.cfopt .source{font-size:9px;color:var(--text2);margin-top:1px}
.cfopt.picked{border-color:var(--green);background:var(--test-ok)}
.cfbtn{background:var(--accent2);border:none;border-radius:6px;padding:6px;color:#fff;font-size:11px;font-weight:500;cursor:pointer;margin-top:8px;width:100%}
.cfbtn:hover{opacity:.85}.cfbtn:disabled{background:var(--border);cursor:not-allowed}
.sblock{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 8px;margin:6px 0;font-family:"SF Mono","Fira Code",monospace;font-size:10px;line-height:1.4;overflow-x:auto;color:var(--green)}
.slabel{font-size:9px;color:var(--text2);margin-bottom:3px;display:flex;align-items:center;gap:4px}
.cpbtn{font-size:9px;color:var(--text2);background:none;border:1px solid var(--border);border-radius:4px;padding:1px 5px;cursor:pointer;margin-left:auto}
.cpbtn:hover{color:var(--text);border-color:var(--accent)}
.rtable{width:100%;border-collapse:collapse;margin:6px 0;font-size:10px}
.rtable th{background:var(--hover);padding:5px 7px;text-align:left;font-weight:600;border-bottom:2px solid var(--border);white-space:nowrap}
.rtable td{padding:4px 7px;border-bottom:1px solid var(--surface2);white-space:nowrap}.rtable tr:hover td{background:var(--hover)}
.expl{font-size:10px;color:var(--text2);margin-top:5px;padding-top:5px;border-top:1px solid var(--border)}
.chartw{margin:8px 0;position:relative;height:240px;width:100%}.chartw canvas{width:100%!important;height:100%!important}
.err{background:var(--err-bg);border:1px solid var(--red);border-radius:6px;padding:8px;margin:5px 0;color:var(--red);font-size:10px;white-space:pre-wrap}
.inbar{display:flex;gap:8px;padding:10px 14px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;transition:background .3s}
.inbar input{flex:1;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:12px;outline:none;transition:background .3s}
.inbar input:focus{border-color:var(--accent)}
.inbar button{background:var(--accent);border:none;border-radius:8px;padding:8px 16px;color:#fff;font-size:12px;font-weight:500;cursor:pointer;flex-shrink:0}
.inbar button:hover{opacity:.85}.inbar button:disabled{background:var(--border);cursor:not-allowed}
.load{display:flex;align-items:center;gap:6px;color:var(--text2);font-size:11px;padding:6px 0}
.load .spin{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
.mover{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.mover.show{display:flex}
.modal{background:var(--modal-bg);border:1px solid var(--border);border-radius:12px;padding:22px;width:480px;max-height:85vh;overflow-y:auto;transition:background .3s}
.modal h2{font-size:15px;margin-bottom:14px;color:var(--text)}
.modal label{display:block;font-size:10px;color:var(--text2);margin-bottom:3px;margin-top:10px}
.modal input,.modal select{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:6px;padding:7px 9px;color:var(--text);font-size:12px;outline:none;transition:background .3s}
.modal input:focus,.modal select:focus{border-color:var(--accent)}
.modal .frow{display:flex;gap:6px}.modal .frow input{flex:1}
.modal .frow button{background:var(--hover);border:1px solid var(--border);color:var(--text2);padding:7px 10px;border-radius:6px;cursor:pointer;font-size:11px;flex-shrink:0}
.modal .acts{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.modal .acts button{padding:7px 14px;border-radius:6px;font-size:11px;cursor:pointer;border:none}
.btn1{background:var(--accent);color:#fff}.btn1:hover{opacity:.85}.btn2{background:var(--border);color:var(--text)}.btn2:hover{opacity:.85}
.btnt{color:var(--accent);border:1px solid var(--accent);font-size:10px;padding:5px 10px;margin-top:4px;border-radius:6px;cursor:pointer;background:transparent}
.tres{font-size:10px;margin-top:6px;padding:6px;border-radius:6px}
.tres.ok{background:var(--test-ok);color:var(--green);border:1px solid var(--green)}
.tres.fail{background:var(--err-bg);color:var(--red);border:1px solid var(--red)}
.rbadge{font-size:8px;background:var(--yellow);color:#000;padding:1px 4px;border-radius:4px;margin-left:3px}
.pbadge{font-size:8px;background:var(--accent2);color:#fff;padding:1px 4px;border-radius:4px;margin-left:3px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fadeIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div class="header"><h1>DataAgent <span class="badge ai">AI 问数</span><span class="badge gov">口径治理</span></h1><div style="display:flex;align-items:center;gap:10px"><span style="font-size:10px;color:var(--text2)">v0.3</span><button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀ 暖色调</button></div></div>
<div class="conn-bar"><span class="lbl">已激活：</span><div class="tags" id="dbTags"><span style="color:var(--text2);font-size:10px">加载中...</span></div></div>
<div class="layout">
<aside class="sidebar">
<div class="sec"><h3>📡 数据源 <button onclick="openModal()">+ 添加</button></h3><div id="connList"><span style="color:var(--text2);font-size:10px">加载中...</span></div></div>
<div class="sec" style="flex:1"><h3>📋 表结构</h3><div class="stree" id="schemaTree">请先激活数据库</div></div>
<div class="sec"><h3>💡 示例</h3><div class="exlist" id="examples"></div></div>
</aside>
<div class="main">
<div class="chat" id="chat"><div class="empty" id="emptyState"><div class="icon">🔍</div><p>激活数据库后，用自然语言提问即可。</p></div></div>
<div class="inbar"><input type="text" id="qInput" placeholder="输入问题..." autofocus><button id="sendBtn" onclick="ask()">发送</button></div>
</div>
</div>
<div class="mover" id="connModal">
<div class="modal">
<h2>添加数据库连接</h2>
<label>数据库类型</label>
<select id="mDialect" onchange="onDChange()"><option value="mysql">MySQL</option><option value="postgresql">PostgreSQL</option><option value="sqlite">SQLite</option><option value="clickhouse">ClickHouse</option></select>
<label>连接名称</label><input id="mName" placeholder="例如：公司 MySQL">
<label>主机地址</label><input id="mHost" value="localhost">
<label>端口</label><input id="mPort" type="number" value="3306">
<label>用户名</label><input id="mUser" value="root">
<label>密码</label><input id="mPass" type="password" placeholder="数据库密码">
<div id="sqliteRow" style="display:none"><label>数据库文件路径 <span style="color:var(--green)">(必填)</span></label><div class="frow"><input id="mDB1" placeholder="C:/path/to/db.db"><button onclick="browseSqlite()">浏览...</button></div></div>
<div id="normalRow"><label>数据库名 <span style="color:var(--green)">(必填)</span></label><input id="mDB2" placeholder="例如：bookstore"></div>
<button class="btnt" onclick="testConn()">测试连接</button><div id="tResult"></div>
<div class="acts"><button class="btn2" onclick="closeModal()">取消</button><button class="btn1" onclick="saveConn()">保存并连接</button></div>
</div>
</div>
<input type="file" id="sqliteFileInput" accept=".db,.sqlite,.sqlite3" style="display:none" onchange="onSqliteFile(event)">
<script>
function toggleTheme(){var b=document.body,btn=document.getElementById("themeBtn"),isDark=!b.classList.contains("warm");b.classList.toggle("warm");btn.textContent=isDark?"☾ 暗黑":"☀ 暖色调";localStorage.setItem("theme",isDark?"warm":"dark");}
(function(){var t=localStorage.getItem("theme");if(t==="warm"){document.body.classList.add("warm");document.getElementById("themeBtn").textContent="☾ 暗黑";}})();
var API="/api",charts={},pending={},selDb=null;
function escH(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function escA(s){return s.replace(/'/g,"\\'").replace(/"/g,"&quot;");}
function init(){document.getElementById("examples").innerHTML=["这个数据库有哪些表？","各表分别有多少行数据？","上月销售额最高的品类？","各年龄段消费能力对比"].map(function(q){return '<button onclick="askEx(\''+escA(q)+'\')">'+escH(q)+"</button>";}).join("");document.getElementById("qInput").addEventListener("keydown",function(e){if(e.key==="Enter")ask();});loadConns();}
async function loadConns(){try{var r=await fetch(API+"/connections"),d=await r.json();renderConns(d.connections);updateTags(d.connections);var act=d.connections.filter(function(c){return c.is_active;});if(act.length>0) loadSchema();}catch(e){document.getElementById("connList").innerHTML='<span style="color:var(--red);font-size:10px">加载失败</span>';}}
function renderConns(cs){var el=document.getElementById("connList");if(!cs||cs.length===0){el.innerHTML='<span style="color:var(--text2);font-size:10px">暂无连接</span>';return;}el.innerHTML=cs.map(function(c){return '<div class="citem'+(c.is_active?" on":"")+'"><div class="ctoggle'+(c.is_active?" on":"")+'" onclick="event.stopPropagation();toggleConn(\''+c.id+'\','+(!c.is_active)+')"></div><span class="cdot '+c.dialect+'"></span><div style="flex:1;min-width:0"><div class="cname">'+escH(c.name||c.database)+'</div><div class="cinfo">'+c.dialect+" / "+c.database+'</div></div><span class="cdel" onclick="event.stopPropagation();delConn(\''+c.id+'\')">x</span></div>';}).join("");}
function updateTags(cs){var act=cs.filter(function(c){return c.is_active;}),el=document.getElementById("dbTags");if(act.length===0){el.innerHTML='<span style="color:var(--red);font-size:10px">无激活数据库</span>';return;}el.innerHTML=act.map(function(c){return '<span class="tag">'+c.dialect+": "+escH(c.name||c.database)+'</span>';}).join("");}
async function toggleConn(id,on){await fetch(API+"/connections/toggle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({conn_id:id,enable:on})});loadConns();loadSchema();}
async function delConn(id){if(!confirm("确定删除?"))return;await fetch(API+"/connections/"+id,{method:"DELETE"});loadConns();loadSchema();}
function openModal(){document.getElementById("mDialect").value="mysql";document.getElementById("mName").value="";document.getElementById("mHost").value="localhost";document.getElementById("mPort").value="3306";document.getElementById("mUser").value="root";document.getElementById("mPass").value="";document.getElementById("mDB1").value="";document.getElementById("mDB2").value="";document.getElementById("tResult").textContent="";document.getElementById("tResult").className="tres";onDChange();document.getElementById("connModal").classList.add("show");}
function closeModal(){document.getElementById("connModal").classList.remove("show");}
function onDChange(){var d=document.getElementById("mDialect").value,pm={mysql:3306,postgresql:5432,sqlite:0,clickhouse:8123};document.getElementById("mPort").value=pm[d]||3306;var isS=d==="sqlite";document.getElementById("sqliteRow").style.display=isS?"block":"none";document.getElementById("normalRow").style.display=isS?"none":"block";document.getElementById("mHost").disabled=isS;document.getElementById("mPort").disabled=isS;document.getElementById("mUser").disabled=isS;document.getElementById("mPass").disabled=isS;}
function browseSqlite(){document.getElementById("sqliteFileInput").click();}
function onSqliteFile(e){var f=e.target.files[0];if(f) document.getElementById("mDB1").value=f.path||f.name;e.target.value="";}
function getBody(){var isS=document.getElementById("mDialect").value==="sqlite";return{dialect:document.getElementById("mDialect").value,name:document.getElementById("mName").value,host:document.getElementById("mHost").value,port:parseInt(document.getElementById("mPort").value)||3306,user:document.getElementById("mUser").value,password:document.getElementById("mPass").value,database:isS?document.getElementById("mDB1").value:document.getElementById("mDB2").value};}
async function testConn(){var b=getBody(),res=document.getElementById("tResult");res.textContent="测试中...";res.className="tres";try{var r=await fetch(API+"/connections/test",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}),d=await r.json();if(d.success){res.innerHTML="连接成功! "+d.description+" "+d.table_count+" 张表 "+d.estimated_rows+" 行<br>表: "+(d.tables||[]).slice(0,10).join(", ")+(d.tables&&d.tables.length>10?"...":"");res.className="tres ok";}else{res.innerHTML="失败: "+escH(d.error)+"<br>建议: "+escH(d.suggestion||"");res.className="tres fail";}}catch(e){res.textContent="请求失败: "+e.message;res.className="tres fail";}}
async function saveConn(){var b=getBody();try{var r=await fetch(API+"/connections",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}),d=await r.json();if(d.success){closeModal();loadConns();loadSchema();}}catch(e){alert("保存失败: "+e.message);}}
async function loadSchema(){try{var r=await fetch(API+"/schema"),d=await r.json();if(d.schemas){var h="";for(var name in d.schemas){var txt=d.schemas[name],isS=name.toLowerCase().indexOf("sqlite")>=0;h+='<div class="dbh" onclick="this.classList.toggle(\'folded\');this.nextElementSibling.classList.toggle(\'folded\')"><span class="arw">▼</span>📁 '+escH(name)+'</div><div class="dbbody">';if(isS) h+='<div class="dbnote">💡 这是本地 SQLite 文件数据库，结构精简，适合轻量查询和原型验证。</div>';var lines=txt.split("\n"),ct="";for(var i=0;i<lines.length;i++){var l=lines[i];if(l.indexOf("## ")==0){if(ct) h+="</div>";ct=l.slice(3).trim();h+='<div class="tname" onclick="this.classList.toggle(\'open\')">'+ct+'</div><div class="cols">';}else if(l.indexOf("  - ")==0) h+="<div>"+escH(l.trim().substring(0,60))+"</div>";}if(ct) h+="</div>";h+="</div>";}document.getElementById("schemaTree").innerHTML=h||"无表结构";}}catch(e){document.getElementById("schemaTree").textContent="加载失败";}}
function askEx(q){document.getElementById("qInput").value=q;ask();}
async function ask(selections,dbParam){
 var inp=document.getElementById("qInput"),btn=document.getElementById("sendBtn");
 var q=selections?selections._q:inp.value.trim();
 if(!q) return;
 if(!selections){inp.value="";inp.disabled=true;btn.disabled=true;}
 var emp=document.getElementById("emptyState");if(emp) emp.remove();
 var chat=document.getElementById("chat");
 if(!selections) chat.insertAdjacentHTML("beforeend",'<div class="msg user">'+escH(q)+"</div>");
 var lid="L"+Date.now();
 chat.insertAdjacentHTML("beforeend",'<div class="load" id="'+lid+'"><span class="spin"></span> AI 分析中...</div>');
 chat.scrollTop=chat.scrollHeight;
 try{
  var body={question:q};
  if(selections){body.metric_selections={};for(var k in selections){if(k[0]!=="_") body.metric_selections[k]=selections[k];}}
  if(dbParam) body.selected_database=dbParam;
  var r=await fetch(API+"/query",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),d=await r.json();
  document.getElementById(lid).remove();
  if(d.metric_conflict){var mid="M"+Date.now();chat.insertAdjacentHTML("beforeend",renderCf(d,mid));}
  else if(d.database_select){var mid="M"+Date.now();chat.insertAdjacentHTML("beforeend",renderDbSel(d,mid));}
  else{var mid="M"+Date.now();chat.insertAdjacentHTML("beforeend",renderMsg(d,mid,selections));if(d.success&&d.columns&&d.rows&&d.rows.length>0) setTimeout(function(){drawChart(mid,d.columns,d.rows);},100);}
  chat.scrollTop=chat.scrollHeight;
 }catch(e){document.getElementById(lid).remove();chat.insertAdjacentHTML("beforeend",'<div class="msg agent"><div class="err">请求失败: '+escH(e.message)+"</div></div>");}
 if(!selections){inp.disabled=false;btn.disabled=false;inp.focus();}
}
function renderMsg(d,mid,sel){
 var h='<div class="msg agent" id="'+mid+'">';
 if(!d.success){h+='<div class="err">'+escH(d.error||"未知错误")+"</div>";if(d.raw_response) h+='<div style="font-size:9px;color:var(--text2);margin-top:3px">模型返回: '+escH(d.raw_response)+"</div>";if(d.sql) h+='<div class="sblock">'+escH(d.sql)+"</div>";h+="</div>";return h;}
 if(d.sql){var rb=d.retried?' <span class="rbadge">已修正</span>':"",pb=sel&&Object.keys(sel).length>1?' <span class="pbadge">已注入口径</span>':"";h+='<div class="slabel">SQL'+rb+pb+' <button class="cpbtn" onclick="copySQL(this,\''+escA(d.sql)+'\')">复制</button></div><div class="sblock">'+escH(d.sql)+"</div>";}
 if(d.columns&&d.rows&&d.rows.length>0){
  h+='<div style="font-size:9px;color:var(--text2);margin-top:5px">结果 ('+d.row_count+' 行)</div><div style="overflow-x:auto"><table class="rtable"><thead><tr>';
  d.columns.forEach(function(c){h+="<th>"+escH(c)+"</th>";});h+="</tr></thead><tbody>";
  d.rows.slice(0,50).forEach(function(row){h+="<tr>";row.forEach(function(cell){h+="<td>"+(cell===null?'<i style="color:var(--text2)">NULL</i>':fmtCell(cell))+"</td>";});h+="</tr>";});
  if(d.rows.length>50) h+='<tr><td colspan="'+d.columns.length+'" style="color:var(--text2);text-align:center;font-style:italic">... 还有 '+ (d.rows.length-50) +' 行</td></tr>';
  h+='</tbody></table></div><div class="chartw"><canvas id="chart-'+mid+'"></canvas></div>';
 }else if(d.success){h+='<div style="color:var(--text2);margin-top:5px">查询成功，无数据返回。</div>';}
 if(d.explanation) h+='<div class="expl">'+escH(d.explanation)+"</div>";
 h+="</div>";return h;
}
/* === FIXED CONFLICT CARD === */
function renderCf(d,mid){
 var h='<div class="msg agent" id="'+mid+'">';d.conflicts.forEach(function(cf){
  h+='<div class="cfcard"><h4>口径冲突: '+cf.metric_name+'</h4><div class="cfopts">';
  cf.definitions.forEach(function(df){
   h+='<div class="cfopt" data-mk="'+cf.metric_key+'" data-did="'+df.definition_id+'" data-mid="'+mid+'" onclick="pickCf(this)"><strong>'+df.definition_name+'</strong><span class="dept">'+(df.owner_department||"")+'</span><div class="desc">'+df.description+'</div><div class="source">来源: '+df.data_source+'</div></div>';
  });
  h+='</div><button class="cfbtn" id="cfbtn-'+mid+'" disabled onclick="resolveCf(\''+mid+'\',\''+escA(d.question)+'\')">请选择口径</button></div>';
 });h+="</div>";pending[mid]={_q:d.question,selections:{}};return h;
}
function pickCf(el){
 var mk=el.getAttribute("data-mk"),did=parseInt(el.getAttribute("data-did")),mid=el.getAttribute("data-mid");
 var card=el.closest(".cfcard");card.querySelectorAll(".cfopt").forEach(function(o){o.classList.remove("picked");});
 el.classList.add("picked");pending[mid].selections[mk]=did;
 card.querySelector(".cfbtn").disabled=false;card.querySelector(".cfbtn").textContent="确认口径，继续查询";
}
function resolveCf(mid,q){
 var d=pending[mid];if(!d||Object.keys(d.selections).length===0) return;
 ask(Object.assign({_q:d._q},d.selections));
}
/* === DB SELECT === */
function renderDbSel(d,mid){
 var h='<div class="msg agent" id="'+mid+'"><div class="selcard"><h4>检测到多个数据库连接，请选择要查询的数据库：</h4><div class="selopts">';
 (d.databases||[]).forEach(function(db,i){
  h+='<div class="selopt" data-dbname="'+escA(db.name)+'" onclick="pickDb(this)"><strong>'+escH(db.name)+'</strong><div class="info">'+db.table_count+" 张表 / "+ (db.tables||[]).slice(0,5).join(", ")+((db.tables||[]).length>5?"...":"")+"</div></div>";
 });
 h+='</div><button class="selbtn" id="dbbtn-'+mid+'" disabled onclick="resolveDb(\''+mid+'\',\''+escA(d.question)+'\')">确认数据库，继续查询</button></div></div>';selDb=null;return h;
}
function pickDb(el){var name=el.getAttribute("data-dbname");var card=el.closest(".selcard");card.querySelectorAll(".selopt").forEach(function(o){o.classList.remove("picked");});el.classList.add("picked");selDb=name;card.querySelector(".selbtn").disabled=false;card.querySelector(".selbtn").textContent="确认数据库，继续查询";}
function resolveDb(mid,q){if(!selDb) return;ask({_q:q},selDb);}
function fmtCell(v){if(typeof v==="number") return Number.isInteger(v)?v.toLocaleString():v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});return escH(String(v));}
function drawChart(mid,cols,rows){
 var cvs=document.getElementById("chart-"+mid);if(!cvs||rows.length===0) return;if(charts[mid]) charts[mid].destroy();
 var labels=rows.map(function(r){return String(r[0]);}),dcs=cols.slice(1).filter(function(c,i){return rows.some(function(r){return typeof r[i+1]==="number";});});
 if(dcs.length===0) return;var colors=["#4f8ff7","#34d399","#fbbf24","#f87171","#a78bfa","#fb923c"];
 var ds=dcs.map(function(col,i){var idx=cols.indexOf(col);return{label:col,data:rows.map(function(r){return r[idx];}),backgroundColor:colors[i%6]+"88",borderColor:colors[i%6],borderWidth:1};});
 charts[mid]=new Chart(cvs,{type:/^\d{4}[-/]\d{2}/.test(String(rows[0][0]))?"line":"bar",data:{labels:labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:"#8b8fa3",font:{size:9}}}},scales:{x:{ticks:{color:"#8b8fa3",font:{size:8},maxRotation:45},grid:{color:"#1a1d27"}},y:{ticks:{color:"#8b8fa3",font:{size:8}},grid:{color:"#1a1d27"}}}}});
}
function copySQL(btn,sql){navigator.clipboard.writeText(sql).then(function(){btn.textContent="已复制!";setTimeout(function(){btn.textContent="复制";},1500);});}
init();
</script>
</body>
</html>
